<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QG do Concurseiro - Flashcards</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center pt-8 font-sans pb-10">

    <!-- Menu de Navegação -->
    <div class="w-full max-w-md flex justify-around mb-4 px-2 border-b border-gray-300 pb-2 bg-white rounded-lg shadow-sm">
        <button onclick="mudarAba('estudo')" class="font-bold text-blue-600 hover:text-blue-800 p-2">📚 Estudar</button>
        <button onclick="mudarAba('criar')" class="font-bold text-green-600 hover:text-green-800 p-2">➕ Criar / Importar</button>
        <button onclick="mudarAba('estatisticas')" class="font-bold text-orange-500 hover:text-orange-700 p-2">📊 Estatísticas</button>
    </div>

    <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-6 relative">
        
        <!-- ÁREA DE ESTUDO -->
        <div id="area-estudo">
            <div class="mb-6 bg-blue-50 p-3 rounded-lg border border-blue-100 flex flex-col gap-2">
                <label class="block text-sm text-blue-800 font-bold">Matéria:</label>
                <select id="select-estudo-baralho" onchange="carregarTopicos('estudo')" class="w-full border-gray-300 rounded p-2 bg-white text-sm"></select>
                
                <label class="block text-sm text-blue-800 font-bold mt-1">Tópico:</label>
                <select id="select-estudo-topico" onchange="carregarFila()" class="w-full border-gray-300 rounded p-2 bg-white text-sm"></select>
            </div>

            <div class="flex justify-between items-center mb-6 text-gray-600 border-b pb-4">
                <span class="font-bold text-lg">🔥 Combo: <span id="combo">0</span></span>
                <span class="text-sm bg-blue-100 text-blue-800 px-3 py-1 rounded-full">Faltam: <span id="contador">0</span></span>
            </div>
            <div id="card-container" class="min-h-[200px] flex flex-col justify-center items-center text-center">
                <h2 id="frente" class="text-2xl font-bold text-gray-800 mb-4">Carregando fichas...</h2>
                <p id="verso" class="text-xl text-gray-600 hidden mt-4 pt-4 border-t w-full"></p>
            </div>
            <div class="mt-8 flex flex-col gap-3">
                <button id="btn-mostrar" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg hidden shadow">Mostrar Resposta</button>
                <div id="btn-feedbacks" class="flex gap-4 hidden">
                    <button onclick="registrarResposta('errei')" class="w-1/2 bg-red-100 hover:bg-red-200 text-red-700 font-bold py-3 rounded-lg shadow">🔴 Errei</button>
                    <button onclick="registrarResposta('acertei')" class="w-1/2 bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-lg shadow">🟢 Acertei (+10)</button>
                </div>
            </div>
            <div id="msg-fim" class="hidden text-center py-10">
                <h2 class="text-2xl font-bold text-green-600 mb-2">🎉 Tudo limpo!</h2>
                <p class="text-gray-600">Nenhuma carta pendente neste tópico.</p>
            </div>
        </div>

        <!-- ÁREA DE CRIAÇÃO E IMPORTAÇÃO -->
        <div id="area-criar" class="hidden">
            <h2 class="text-xl font-bold text-gray-800 mb-4 border-b pb-2">Gerenciar Cartas</h2>
            
            <div class="mb-4 flex flex-col gap-2">
                <label class="block text-sm text-gray-700 font-bold">Matéria:</label>
                <div class="flex gap-2">
                    <select id="select-criar-baralho" onchange="carregarTopicos('criar')" class="w-full border border-gray-300 rounded p-2 bg-white"></select>
                    <button onclick="novaMateria()" class="bg-blue-100 text-blue-700 font-bold px-4 rounded hover:bg-blue-200 shadow-sm transition" title="Criar Nova Matéria">+</button>
                </div>

                <label class="block text-sm text-gray-700 font-bold mt-1">Tópico:</label>
                <div class="flex gap-2">
                    <select id="select-criar-topico" class="w-full border border-gray-300 rounded p-2 bg-white"></select>
                    <button onclick="novoTopico()" class="bg-blue-100 text-blue-700 font-bold px-4 rounded hover:bg-blue-200 shadow-sm transition" title="Criar Novo Tópico">+</button>
                </div>
            </div>

            <div class="flex flex-col gap-3">
                <label class="block text-sm text-gray-700 font-bold mt-2">Criar Manualmente</label>
                <textarea id="nova-frente" class="w-full border rounded-lg p-2 h-16 text-sm" placeholder="Pergunta..."></textarea>
                <textarea id="novo-verso" class="w-full border rounded-lg p-2 h-16 text-sm" placeholder="Resposta..."></textarea>
                <button onclick="salvarCardUnico()" class="w-full bg-green-600 text-white font-bold py-2 rounded-lg shadow">Salvar 1 Ficha</button>
            </div>

            <div class="mt-6 p-4 border rounded-lg bg-gray-50 border-dashed border-gray-300">
                <label class="block text-sm text-gray-700 font-bold mb-1">Importar em Lote (CSV)</label>
                <p class="text-xs text-gray-500 mb-3">O arquivo CSV deve conter o formato <b>Pergunta;Resposta</b> em cada linha.</p>
                <input type="file" id="arquivo-csv" accept=".csv" class="mb-3 text-sm w-full">
                <button onclick="importarCSV()" class="w-full bg-purple-600 text-white font-bold py-2 rounded-lg shadow">Processar e Importar CSV</button>
            </div>
            
            <p id="msg-sucesso" class="text-green-600 font-bold text-center mt-4 hidden">Operação realizada com sucesso!</p>
        </div>

        <!-- ÁREA DE ESTATÍSTICAS -->
        <div id="area-estatisticas" class="hidden">
            <h2 class="text-xl font-bold text-gray-800 mb-2 border-b pb-2">Ranking: Cards Mais Errados 📉</h2>
            <p class="text-sm text-gray-500 mb-4">Foque nestes conceitos antes da prova.</p>
            <ul id="lista-ranking" class="divide-y divide-gray-200">
                <!-- Preenchido via JS -->
            </ul>
        </div>

    </div>

    <script>
        let fila = [], cartaAtual = null, combo = 0;
        const usuarioId = 1;

        async function inicializarApp() {
            const res = await fetch(`/api/baralhos/${usuarioId}`);
            const baralhos = await res.json();
            
            const sEstudo = document.getElementById('select-estudo-baralho');
            const sCriar = document.getElementById('select-criar-baralho');
            sEstudo.innerHTML = ''; sCriar.innerHTML = '';
            
            baralhos.forEach(b => {
                const opt = `<option value="${b.id}">${b.nome}</option>`;
                sEstudo.innerHTML += opt; sCriar.innerHTML += opt;
            });

            if(baralhos.length > 0) {
                await carregarTopicos('estudo');
                await carregarTopicos('criar');
            }
        }

        async function carregarTopicos(aba) {
            const baralhoId = document.getElementById(`select-${aba}-baralho`).value;
            if(!baralhoId) return;

            const res = await fetch(`/api/topicos/${baralhoId}`);
            const topicos = await res.json();
            
            const selectTopico = document.getElementById(`select-${aba}-topico`);
            selectTopico.innerHTML = '';
            
            topicos.forEach(t => {
                selectTopico.innerHTML += `<option value="${t.id}">${t.nome}</option>`;
            });

            if(aba === 'estudo' && topicos.length > 0) carregarFila();
        }

        async function mudarAba(aba) {
            document.getElementById('area-estudo').classList.toggle('hidden', aba !== 'estudo');
            document.getElementById('area-criar').classList.toggle('hidden', aba !== 'criar');
            document.getElementById('area-estatisticas').classList.toggle('hidden', aba !== 'estatisticas');
            
            if(aba === 'estudo') carregarFila();
            if(aba === 'estatisticas') carregarEstatisticas();
        }

        // --- CRIAR MATÉRIA E TÓPICO NA HORA ---
        async function novaMateria() {
            const nome = prompt("Digite o nome da nova Matéria:");
            if (!nome || nome.trim() === "") return;
            
            const res = await fetch('/api/baralhos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome: nome.trim(), usuario_id: usuarioId })
            });
            const data = await res.json();
            
            // Recarrega tudo e seleciona a nova matéria
            await inicializarApp();
            document.getElementById('select-criar-baralho').value = data.id;
            document.getElementById('select-estudo-baralho').value = data.id;
            await carregarTopicos('criar');
        }

        async function novoTopico() {
            const baralhoId = document.getElementById('select-criar-baralho').value;
            if (!baralhoId) return alert("Por favor, selecione ou crie uma Matéria primeiro.");
            
            const nome = prompt("Digite o nome do novo Tópico:");
            if (!nome || nome.trim() === "") return;
            
            const res = await fetch('/api/topicos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome: nome.trim(), baralho_id: parseInt(baralhoId) })
            });
            const data = await res.json();
            
            await carregarTopicos('criar');
            await carregarTopicos('estudo');
            document.getElementById('select-criar-topico').value = data.id;
        }

        // --- FUNÇÕES DE CRIAÇÃO E IMPORTAÇÃO DE CARTAS ---
        function mostrarSucesso(msgText) {
            const msg = document.getElementById('msg-sucesso');
            msg.innerText = msgText;
            msg.classList.remove('hidden');
            setTimeout(() => msg.classList.add('hidden'), 4000);
        }

        async function salvarCardUnico() {
            const topico_id = document.getElementById('select-criar-topico').value;
            if(!topico_id) return alert("Crie um Tópico antes de adicionar uma ficha.");

            const frente = document.getElementById('nova-frente').value;
            const verso = document.getElementById('novo-verso').value;
            if(!frente || !verso) return alert("Preencha frente e verso!");

            await fetch('/api/fichas', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ topico_id: parseInt(topico_id), frente, verso, usuario_id: usuarioId })
            });

            document.getElementById('nova-frente').value = '';
            document.getElementById('novo-verso').value = '';
            mostrarSucesso("1 Ficha adicionada com sucesso!");
        }

        function importarCSV() {
            const topico_id = document.getElementById('select-criar-topico').value;
            if(!topico_id) return alert("Crie um Tópico antes de importar um CSV.");

            const input = document.getElementById('arquivo-csv');
            if(!input.files[0]) return alert("Selecione um arquivo CSV primeiro.");
            
            const reader = new FileReader();
            reader.onload = async function(e) {
                const linhas = e.target.result.split('\n');
                const fichasParaSalvar = [];

                for(let linha of linhas) {
                    const partes = linha.split(';');
                    if(partes.length >= 2 && partes[0].trim() !== '') {
                        fichasParaSalvar.push({
                            frente: partes[0].trim(),
                            verso: partes.slice(1).join(';').trim()
                        });
                    }
                }

                if(fichasParaSalvar.length === 0) return alert("Nenhuma carta válida encontrada no CSV.");

                await fetch('/api/fichas/lote', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ topico_id: parseInt(topico_id), usuario_id: usuarioId, fichas: fichasParaSalvar })
                });

                input.value = '';
                mostrarSucesso(`${fichasParaSalvar.length} cartas importadas com sucesso!`);
            };
            reader.readAsText(input.files[0]);
        }

        // --- FUNÇÕES DE ESTUDO ---
        async function carregarFila() {
            const topicoId = document.getElementById('select-estudo-topico').value;
            if (!topicoId) return;

            const res = await fetch(`/api/revisao/${usuarioId}/${topicoId}`);
            const data = await res.json();
            fila = data.cartas;
            exibirProximaCarta();
        }

        function exibirProximaCarta() {
            const btnMostrar = document.getElementById('btn-mostrar');
            const btnFeedbacks = document.getElementById('btn-feedbacks');
            const cardContainer = document.getElementById('card-container');
            const msgFim = document.getElementById('msg-fim');

            if (fila.length === 0) {
                cardContainer.classList.add('hidden');
                btnMostrar.classList.add('hidden');
                btnFeedbacks.classList.add('hidden');
                msgFim.classList.remove('hidden');
                document.getElementById('contador').innerText = "0";
                return;
            }

            cardContainer.classList.remove('hidden');
            msgFim.classList.add('hidden');
            cartaAtual = fila.shift();
            document.getElementById('contador').innerText = fila.length + 1;
            
            document.getElementById('frente').innerText = cartaAtual.frente;
            document.getElementById('verso').innerText = cartaAtual.verso;
            document.getElementById('verso').classList.add('hidden');
            
            btnMostrar.classList.remove('hidden');
            btnFeedbacks.classList.add('hidden');
        }

        document.getElementById('btn-mostrar').addEventListener('click', () => {
            document.getElementById('verso').classList.remove('hidden');
            document.getElementById('btn-mostrar').classList.add('hidden');
            document.getElementById('btn-feedbacks').classList.remove('hidden');
        });

        async function registrarResposta(resposta) {
            if(resposta === 'acertei') {
                combo++; document.getElementById('combo').innerText = combo;
            } else {
                combo = 0; document.getElementById('combo').innerText = combo;
            }

            await fetch('/api/responder', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario_id: usuarioId, ficha_id: cartaAtual.ficha_id, resposta })
            });
            exibirProximaCarta();
        }

        // --- FUNÇÕES DE ESTATÍSTICA ---
        async function carregarEstatisticas() {
            const res = await fetch(`/api/estatisticas/${usuarioId}`);
            const ranking = await res.json();
            const lista = document.getElementById('lista-ranking');
            lista.innerHTML = '';

            if(ranking.length === 0) {
                lista.innerHTML = '<p class="text-sm text-gray-500 py-4 text-center">Você ainda não registrou erros. Continue estudando!</p>';
                return;
            }

            ranking.forEach((item, index) => {
                lista.innerHTML += `
                    <li class="py-3 flex justify-between items-center">
                        <div class="flex flex-col pr-4">
                            <span class="font-bold text-gray-800 text-sm">#${index+1} - ${item.frente}</span>
                            <span class="text-xs text-gray-500">${item.baralho} > ${item.topico}</span>
                        </div>
                        <span class="bg-red-100 text-red-800 font-bold px-3 py-1 rounded-full text-sm shrink-0">${item.total_erros} erros</span>
                    </li>
                `;
            });
        }

        inicializarApp();
    </script>
</body>
</html>
