<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QG do Concurseiro - Revisão</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center font-sans">

    <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-6 relative">
        <!-- HUD (Gamificação) -->
        <div class="flex justify-between items-center mb-6 text-gray-600 border-b pb-4">
            <span class="font-bold text-lg">🔥 Combo: <span id="combo">0</span></span>
            <span class="text-sm bg-blue-100 text-blue-800 px-3 py-1 rounded-full">Faltam: <span id="contador">0</span></span>
        </div>

        <!-- Área da Ficha -->
        <div id="card-container" class="min-h-[250px] flex flex-col justify-center items-center text-center">
            <h2 id="frente" class="text-2xl font-bold text-gray-800 mb-4">Carregando fichas...</h2>
            <p id="verso" class="text-xl text-gray-600 hidden mt-4 pt-4 border-t w-full"></p>
        </div>

        <!-- Controles -->
        <div class="mt-8 flex flex-col gap-3">
            <button id="btn-mostrar" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow transition-colors hidden">
                Mostrar Resposta
            </button>
            
            <div id="btn-feedbacks" class="flex gap-4 hidden">
                <button onclick="registrarResposta('errei')" class="w-1/2 bg-red-100 hover:bg-red-200 text-red-700 font-bold py-3 px-4 rounded-lg shadow transition-colors">
                    🔴 Errei
                </button>
                <button onclick="registrarResposta('acertei')" class="w-1/2 bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg shadow transition-colors">
                    🟢 Acertei (+10 XP)
                </button>
            </div>
        </div>
        
        <!-- Mensagem de Fim -->
        <div id="msg-fim" class="hidden text-center py-10">
            <h2 class="text-3xl font-bold text-green-600 mb-2">🎉 Sessão Concluída!</h2>
            <p class="text-gray-600">Você revisou todas as cartas de hoje. Bom descanso!</p>
        </div>
    </div>

    <script>
        const usuarioId = 1; // Fixo para este MVP
        let fila = [];
        let cartaAtual = null;
        let combo = 0;

        // Elementos da UI
        const elFrente = document.getElementById('frente');
        const elVerso = document.getElementById('verso');
        const btnMostrar = document.getElementById('btn-mostrar');
        const btnFeedbacks = document.getElementById('btn-feedbacks');
        const cardContainer = document.getElementById('card-container');
        const msgFim = document.getElementById('msg-fim');
        const elContador = document.getElementById('contador');
        const elCombo = document.getElementById('combo');

        async function carregarFila() {
            const res = await fetch(`/api/revisao/${usuarioId}`);
            const data = await res.json();
            fila = data.cartas;
            exibirProximaCarta();
        }

        function exibirProximaCarta() {
            if (fila.length === 0) {
                cardContainer.classList.add('hidden');
                btnMostrar.classList.add('hidden');
                btnFeedbacks.classList.add('hidden');
                msgFim.classList.remove('hidden');
                elContador.innerText = "0";
                return;
            }

            cartaAtual = fila.shift(); // Remove a primeira da fila
            elContador.innerText = fila.length + 1;
            
            // Estado inicial da carta
            elFrente.innerText = cartaAtual.frente;
            elVerso.innerText = cartaAtual.verso;
            elVerso.classList.add('hidden');
            
            btnMostrar.classList.remove('hidden');
            btnFeedbacks.classList.add('hidden');
        }

        btnMostrar.addEventListener('click', () => {
            elVerso.classList.remove('hidden');
            btnMostrar.classList.add('hidden');
            btnFeedbacks.classList.remove('hidden');
        });

        async function registrarResposta(resposta) {
            // Gamificação visual local
            if(resposta === 'acertei') {
                combo++;
                elCombo.innerText = combo;
                elCombo.classList.add('text-orange-500');
            } else {
                combo = 0;
                elCombo.innerText = combo;
                elCombo.classList.remove('text-orange-500');
            }

            // Envia para o backend (Algoritmo SM-2)
            await fetch('/api/responder', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    usuario_id: usuarioId,
                    ficha_id: cartaAtual.ficha_id,
                    resposta: resposta
                })
            });

            // Passa para a próxima
            exibirProximaCarta();
        }

        // Inicia o app
        carregarFila();
    </script>
</body>
</html>
